[project]
name = "confab-backend"
version = "0.1.0"
description = "Confab backend — local AI meeting assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.27.0",
    "ollama>=0.6.2",
    "onnx-asr>=0.12.0",
    "pyannote-audio>=4.0.5",
    "pydantic>=2.13.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.9",
    "reportlab>=5.0.0",
    "sentence-transformers>=5.6.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.20.1",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
# The e2e suite loads real models (~35 s) — run it explicitly: pytest tests/e2e
addopts = "--ignore=tests/e2e"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["database", "packages", "routers", "sessions"]
