[project]
name = "meetingmind-backend"
version = "0.1.0"
description = "MeetingMind backend — local AI meeting assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.0",
    "faster-whisper>=1.2.1",
    "ollama>=0.6.2",
    "pyannote-audio>=4.0.5",
    "pydantic>=2.13.4",
    "sentence-transformers>=5.6.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "huggingface-hub>=1.20.1",
    "pytest>=9.1.1",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["packages"]
